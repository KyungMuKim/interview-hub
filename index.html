<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>씨앤씨 면접반</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#f4f6fb; --card:#fff; --ink:#1c2333; --sub:#68718a; --pri:#4f6ef7; --ok:#16a34a; --no:#dc2626; --line:#e5e9f2; --warn:#b45309; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); padding:16px; max-width:760px; margin:0 auto;}
  .card{background:var(--card); border-radius:16px; padding:22px; box-shadow:0 2px 10px rgba(20,30,60,.06); margin-bottom:14px;}
  h1{font-size:1.5rem; margin-bottom:6px;} h2{font-size:1.2rem; margin-bottom:8px;} h3{font-size:1.02rem; margin:14px 0 6px;}
  .sub{color:var(--sub); font-size:.9rem; margin-bottom:14px;}
  .small{color:var(--sub); font-size:.8rem;}
  .pill{background:#eef2ff; border-radius:10px; padding:12px 14px; font-size:.95rem; margin:10px 0; line-height:1.5;}
  .word{font-size:2rem; font-weight:800; margin:18px 0 8px;}
  input[type=text],input[type=date],input[type=number],input[type=url]{width:100%; font-size:1.05rem; padding:11px 13px; border:2px solid var(--line); border-radius:10px; outline:none; margin:6px 0;}
  input:focus,textarea:focus,select:focus{border-color:var(--pri);}
  textarea{width:100%; min-height:320px; font-size:1rem; line-height:1.7; padding:14px; border:2px solid var(--line); border-radius:12px; outline:none; resize:vertical; font-family:inherit;}
  .btn-primary{background:var(--pri); color:#fff; border:none; border-radius:10px; padding:13px 22px; font-size:1.05rem; font-weight:700; cursor:pointer; width:100%;}
  .btn-ghost{background:#eef1f8; color:var(--ink); border:none; border-radius:10px; padding:10px 16px; font-size:.95rem; cursor:pointer;}
  .btn-danger{background:#fee2e2; color:#b91c1c; border:none; border-radius:10px; padding:10px 16px; font-size:.95rem; cursor:pointer;}
  .btn-sm{padding:6px 10px; font-size:.82rem; border-radius:8px;}
  .row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .row .btn-primary{flex:1; width:auto;}
  .student-btn{display:inline-block; background:#eef2ff; border:2px solid transparent; border-radius:12px; padding:14px 18px; margin:5px 4px; font-size:1.05rem; font-weight:700; cursor:pointer;}
  .student-btn:active{border-color:var(--pri);}
  .progress{height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin:8px 0 4px;}
  .progress div{height:100%; background:var(--pri); transition:width .2s;}
  table{width:100%; border-collapse:collapse; font-size:.9rem; margin-top:10px;}
  th,td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
  th{color:var(--sub); font-weight:600; font-size:.8rem;}
  .badge{font-size:.68rem; font-weight:700; border-radius:6px; padding:2px 7px; vertical-align:middle; margin-left:6px; white-space:nowrap;}
  .b-oego{background:#dbeafe; color:#1d4ed8;} .b-jasa{background:#fef3c7; color:#b45309;}
  .b-eng{background:#dcfce7; color:#166534;} .b-both{background:#e9d5ff; color:#7e22ce;} .b-none{background:#e5e9f2; color:#475569;}
  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .tab{flex:1; min-width:90px; text-align:center; padding:10px; border-radius:10px; background:#eef1f8; font-weight:700; font-size:.9rem; cursor:pointer;}
  .tab.on{background:var(--pri); color:#fff;}
  select{font-size:1rem; padding:10px; border:2px solid var(--line); border-radius:10px; background:#fff; margin:6px 0;}
  .flag{background:#f0fdf4; color:#166534; font-size:.85rem; border-radius:8px; padding:9px 11px; margin:8px 0; line-height:1.5;}
  .flag.amber{background:#fffbeb; color:#92400e;}
  .flag.red{background:#fef2f2; color:#991b1b;}
  .item{border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0;}
  .item:active{border-color:var(--pri);}
  .item h4{font-size:1rem; margin-bottom:4px;}
  .clickable{cursor:pointer;}
  .comment{background:#fffbeb; border-radius:10px; padding:10px 12px; margin:8px 0; font-size:.92rem; line-height:1.6; white-space:pre-wrap; word-break:break-word;}
  .comment .small{margin-top:4px; display:block;}
  .cnt{font-size:.82rem; color:var(--sub); text-align:right; margin-top:4px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;}
  pre.essay-view{white-space:pre-wrap; font-family:inherit; font-size:.98rem; line-height:1.8; background:#f8fafc; border-radius:12px; padding:16px;}
  body.wide{max-width:1200px;}
  /* 선생님 열람 화면: 학생 글(왼쪽)과 코멘트 칸(오른쪽)이 각자 따로 스크롤 */
  body.wide:has(.tsplit){max-width:1560px;}
  @media (min-width:900px){
    .split.tsplit{flex-wrap:nowrap;}
    .split.tsplit .main, .split.tsplit .side{flex:1; min-width:0; height:calc(100vh - 170px); min-height:420px; overflow-y:auto; padding-right:8px;}
    .split.tsplit #cmt{min-height:calc(100vh - 380px);}
  }
  .split{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;}
  .split .main{flex:2; min-width:320px;}
  .split .side{flex:1; min-width:260px;}
  .quote{background:#fef3c7; border-left:3px solid #d97706; padding:6px 10px; margin:6px 0; font-size:.88rem; line-height:1.55; white-space:pre-wrap; border-radius:6px;}
  .quote.gone{background:#f1f5f9; border-left-color:#94a3b8; color:#64748b;}
  .prop{background:#fff; border:1px solid #fcd34d; border-radius:8px; padding:9px 11px; margin-top:8px;}
  .proptxt{white-space:pre-wrap; word-break:break-word; line-height:1.75; font-size:.95rem; margin-top:6px;}
  .dfgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
  .dfgrid > div{background:#f8fafc; border-radius:8px; padding:8px 10px;}
  @media (max-width:700px){ .dfgrid{grid-template-columns:1fr;} }
  .dfd{background:#fee2e2; color:#991b1b; text-decoration:line-through;}
  .dfi{background:#dcfce7; color:#166534;}
  mark.hl{background:#fde68a; border-radius:3px; padding:0 2px;}
  .yg{background:#f1f5f9; border:1px solid #cbd5e1; border-radius:8px; padding:8px 11px; margin:8px 0 6px; font-size:.86rem; line-height:1.6; color:#334155; word-break:keep-all;}
  .ygnote{font-size:.82rem; color:#475569; line-height:1.55; margin:3px 0;}
  .slab{font-size:.9rem; font-weight:600; margin:10px 0 4px; color:#1e293b;}
  .cnt.over{color:#b91c1c; font-weight:700;}
  .formhead{font-weight:700; margin:10px 0 2px;}
  .ygsrc{font-size:.8rem; color:#475569; margin:10px 0 2px;}
  .ygnote.yo{background:#f8fafc; border-left:3px solid #94a3b8; padding:5px 9px; border-radius:4px;}
  pre.essay-view.selectable{cursor:text; user-select:text;}
  pre.essay-view.selectable::selection, pre.essay-view.selectable *::selection{background:#fde68a;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= 설정 ================= */
const CONFIG = {
  SUPABASE_URL: "https://xtxuozcbeqruuigeijsz.supabase.co",
  SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0eHVvemNiZXFydXVpZ2VpanN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNjI4MzMsImV4cCI6MjA5ODczODgzM30.kuHunWODG6_lv3JajIMmr6Xw7yEORy-Dixs-EB4sYaM",
  // ▼ Apps Script 웹 앱 URL (면접반 업로드 백엔드)
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxZoPEmc_hVabGyF9O0oOQAmb3WYr0XGrEIPkX8xDiHzfx7Mkv5Gam_mPnvi5ooP8Fihg/exec",
  CHUNK: 8 * 1024 * 1024,          // 서버 경유(폴백) 조각 — 8MB (256KB의 배수 — 변경 금지)
  DIRECT_CHUNK: 32 * 1024 * 1024   // 드라이브 직접 전송 조각 — 32MB (256KB의 배수)
};
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const app = document.getElementById("app");

/* ================= 상태 ================= */
let ME = null;          // 로그인한 학생 {id,name,track,interview_class,...}
let TPIN = null;        // 선생님 PIN(검증 후 보관)
let PINLIST = null;     // 선생님용 학생·PIN 목록

/* ================= 유틸 ================= */
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nc = t => String(t||"").replace(/\s/g,"").length; // 글자수 = 공백 제외
const err = e => { app.innerHTML = `<div class="card"><h2>오류</h2><div class="flag red">${esc(e.message||e)}</div><div class="row"><button class="btn-ghost" onclick="home()">← 처음으로</button></div></div>`; throw e; };
const fmtDT = t => { const d=new Date(t); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const fmtD = t => t ? String(t).slice(0,10).replace(/-/g,".") : "";
const trackBadge = s => s.track==="interview" ? '<span class="badge b-oego">면접</span>'
  : s.track==="both" ? '<span class="badge b-both">면접+영어</span>' : '<span class="badge b-eng">영어</span>';
const classBadge = s => s.interview_class==="외고국제고" ? '<span class="badge b-oego">외고·국제고</span>'
  : s.interview_class==="자사고" ? '<span class="badge b-jasa">자사고</span>' : "";
const mb = b => b ? (b/1024/1024).toFixed(1)+"MB" : "-";
const isInterview = s => s.track==="interview" || s.track==="both";
/* 대상 필터: 분반 미지정 학생에게는 전부 보여줌 */
const forMe = (row, st) => row.target==="전체" || !st.interview_class || row.target===st.interview_class;
/* 코멘트 파트 라벨 */
const PART_LABEL = { "1":"① 자기주도학습", "2":"② 지원동기·진로", "3":"③ 인성", "backup":"📦 백업", "all":"전체" };
const partBadge = p => `<span class="badge ${p==="all"?"b-none":"b-oego"}">${esc(partName(p))}</span>`;
/* 학생 화면 코멘트 카드 (확인/반영 버튼 포함) */
const quoteBox = (c, editable) => {
  if(!c.quote) return "";
  const src = editable ? (partText(c.part)||"") : (window._essayTexts||{})[c.part]||"";
  const found = src.indexOf(c.quote) >= 0;
  return `<div class="quote ${found?"":"gone"}">${found?"":"<b>원문이 수정됨 · </b>"}“${esc(c.quote)}”${found&&editable?` <button class="btn-ghost btn-sm" style="padding:2px 6px" onclick="findQuote('${c.part}', ${JSON.stringify(c.quote).replace(/"/g,"&quot;")})">본문에서 찾기</button>`:""}</div>`;
};
const partText = p => { const el = document.getElementById(p==="1"?"essayText":p==="2"?"essayText2":p==="3"?"essayText3":p==="backup"?"backupText":""); return el ? el.value : ""; };
/* 고쳐 쓴 글(제안본) 코멘트: content 첫 줄이 PROP_TAG. 구분선(---)이 있으면 위는 설명, 아래가 고쳐 쓴 글 */
const PROP_TAG = "[[제안본]]";
const DIV_RE = /^[ \t]*[-─—=]{3,}[ \t]*$/m;
const isProp = c => ["1","2","3"].includes(c.part) && String(c.content||"").startsWith(PROP_TAG);
const cmText = c => { const t = String(c.content||""); return t.startsWith(PROP_TAG) ? t.slice(PROP_TAG.length).replace(/^\r?\n/,"") : t; };
const propSplit = t => { t = String(t||""); const m = t.match(DIV_RE); return m ? { note: t.slice(0, m.index).trim(), prop: t.slice(m.index + m[0].length).trim() } : { note: "", prop: t.trim() }; };
const cmBody = c => {
  (window._cm || (window._cm = {}))[c.id] = c;
  if(!isProp(c)) return `<div style="margin-top:6px">${esc(cmText(c))}</div>`;
  const q = propSplit(cmText(c));
  return `${q.note?`<div style="margin-top:6px">${esc(q.note)}</div>`:""}<div class="prop"><b>✍️ 고쳐 쓴 글 (제안)</b> <span class="small" style="display:inline">${nc(q.prop).toLocaleString()}자 · 공백 제외</span><div class="proptxt">${esc(q.prop)}</div><div class="row" style="margin-top:6px"><button class="btn-ghost btn-sm" onclick="propDiff('${c.id}')">내 글과 비교</button><button class="btn-ghost btn-sm" onclick="propApply('${c.id}')">이 글로 바꾸기</button></div><div id="pd-${c.id}"></div></div>`;
};
/* 어절 단위 비교: 내 글에서 빠지는 부분(dfd), 고쳐 쓴 글에서 새로 들어온 부분(dfi) */
function wordDiff(a, b){
  const tk = t => String(t||"").split(/(\s+)/).filter(x=>x!=="");
  const A = tk(a), B = tk(b), isW = x => !/^\s+$/.test(x);
  const ai = A.map((x,i)=>isW(x)?i:-1).filter(i=>i>=0), bi = B.map((x,i)=>isW(x)?i:-1).filter(i=>i>=0);
  const n = ai.length, m = bi.length, W = m+1, L = new Uint16Array((n+1)*W);
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i*W+j] = A[ai[i]]===B[bi[j]] ? L[(i+1)*W+j+1]+1 : Math.max(L[(i+1)*W+j], L[i*W+j+1]);
  const keepA = new Set(), keepB = new Set();
  for(let i=0,j=0; i<n && j<m; ){ if(A[ai[i]]===B[bi[j]]){ keepA.add(ai[i]); keepB.add(bi[j]); i++; j++; } else if(L[(i+1)*W+j] >= L[i*W+j+1]) i++; else j++; }
  const out = (T, keep, cls) => T.map((x,i)=> !isW(x) || keep.has(i) ? esc(x) : `<span class="${cls}">${esc(x)}</span>`).join("");
  return { a: out(A, keepA, "dfd"), b: out(B, keepB, "dfi"), same: n===m && keepA.size===n };
}
let PROP_PENDING = { essayId: null, ids: [] };   // "이 글로 바꾸기"를 누른 코멘트: 저장하면 반영됨으로 표시
window.propDiff = function(id){
  const c = (window._cm||{})[id], box = document.getElementById("pd-"+id); if(!c || !box) return;
  if(box.innerHTML){ box.innerHTML = ""; return; }
  const ta = document.getElementById(SLOT_TA[c.part]);
  if(!ta || ta.style.display==="none"){ box.innerHTML = `<div class="small" style="display:block">지금 양식에는 이 칸이 없어서 비교할 수 없어요.</div>`; return; }
  const d = wordDiff(ta.value, propSplit(cmText(c)).prop);
  box.innerHTML = d.same ? `<div class="small" style="display:block">지금 내 글과 같아요.</div>`
    : `<div class="dfgrid"><div><b>지금 내 글</b> <span class="small" style="display:inline">${nc(ta.value).toLocaleString()}자 · 빨간 줄은 빠지는 부분</span><div class="proptxt">${d.a}</div></div><div><b>고쳐 쓴 글</b> <span class="small" style="display:inline">초록은 새로 들어온 부분</span><div class="proptxt">${d.b}</div></div></div>`;
};
window.propApply = function(id){
  const c = (window._cm||{})[id]; if(!c) return;
  const ta = document.getElementById(SLOT_TA[c.part]), bt = document.getElementById("backupText");
  if(!ta || ta.style.display==="none") return alert("지금 양식에는 이 칸이 없어요. 지원 학교 양식을 확인해 주세요.");
  const next = propSplit(cmText(c)).prop, old = ta.value;
  if(old.trim() === next) return alert("지금 내 글과 같아요.");
  if(!confirm(`[${partName(c.part)}] 칸의 글을 고쳐 쓴 글로 바꿀까요?\n지금 글은 백업 섹션 맨 아래로 옮겨 둘게요.\n바꾼 뒤 읽어 보고 저장을 눌러야 확정돼요.`)) return;
  if(nc(old) && bt){
    bt.value = bt.value.replace(/\s+$/,"") + (bt.value.trim() ? "\n\n" : "") + `[바꾸기 전 글 · ${partName(c.part)} · ${fmtDT(Date.now()).slice(5)}]\n` + old.trim();
    bt.dispatchEvent(new Event("input"));
  }
  ta.value = next; ta.dispatchEvent(new Event("input"));
  if(ESSAY_EDIT){ if(PROP_PENDING.essayId !== ESSAY_EDIT.id) PROP_PENDING = { essayId: ESSAY_EDIT.id, ids: [] }; if(!PROP_PENDING.ids.includes(id)) PROP_PENDING.ids.push(id); }
  const box = document.getElementById("pd-"+id); if(box) box.innerHTML = `<div class="small" style="display:block; color:#166534">바꿨어요. 읽어 보고 <b>저장</b>을 눌러 주세요. (이전 글은 백업 섹션에 있어요)</div>`;
  draftFlush();
  ta.scrollIntoView({behavior:"smooth", block:"center"});
};
const stuComment = c => `<div class="comment" id="cm-${c.id}">${partBadge(c.part||"all")}${quoteBox(c, true)}${cmBody(c)}
  <span class="small">${fmtDT(c.created_at)}
    ${c.student_status==="applied"?'<b style="color:#166534">✅ 반영했어요</b>':c.student_status==="seen"?'<b style="color:#1d4ed8">👀 확인했어요</b> <button class="btn-ghost btn-sm" onclick="markComment(\''+c.id+'\',\'applied\')">반영했어요</button>':'<button class="btn-ghost btn-sm" onclick="markComment(\''+c.id+'\',\'seen\')">확인했어요</button> <button class="btn-ghost btn-sm" onclick="markComment(\''+c.id+'\',\'applied\')">반영했어요</button>'}
  </span></div>`;
const commentsFor = (list, part) => (list||[]).filter(c=>(c.part||"all")===part).map(stuComment).join("");

/* ================= 학교별 자소서 양식 (2027학년도 각 학교 요강 [서식] 원문) =================
   칸(slot)은 DB 컬럼에 고정: "1"=content, "2"=content2, "3"=content3. 학교마다 라벨·발문·글자수만 바뀜.
   kind: max=이내(초과 시 빨강) / approx=내외 / rec=요강 권장 배분 */
const INS = (list) => `○ 본인의 인성(${list})을 나타낼 수 있는 개인적 경험 및 이를 통해 배우고 느낀 점을 구체적으로 기술하십시오.`;
const INS_STD = INS("배려, 나눔, 협력, 타인 존중, 규칙준수 등");
const O1 = w => `○ 본인이 스스로 학습계획을 세우고 학습해 온 과정과 그 과정에서 느꼈던 점, 학교 특성과 연계해 ${w}에 관심을 갖게 된 동기, 고등학교 입학 후 자기주도적으로 본인의 꿈과 끼를 살리기 위한 활동계획 및 고등학교 졸업 후 진로계획에 관하여 구체적으로 기술하십시오.`;
const NOTE_ONEBOX = "원서 양식에서는 두 ○ 발문 아래에 한 칸이 있어요. 여기서는 쓰기 편하게 칸을 나눴고, 제출할 때는 순서대로 이어 붙이면 돼요.";
/* 경기도 외고·국제고형: ○ 두 개, 원서에서는 한 칸 */
const ggForm = (o) => ({
  head: o.head, total: 1500, src: o.src,

const kindTxt = (g) => g.kind==="approx" ? `${g.max.toLocaleString()}자 내외` : g.kind==="rec" ? `권장 약 ${g.max.toLocaleString()}자` : `${g.max.toLocaleString()}자 이내`;
/* 칸별·발문별·합계 글자수 문구 (get(slot) = 그 칸의 현재 텍스트) */
function formCounts(f, get){
  const used = formSlots(f);
  const extra = ["1","2","3"].filter(s=>!used.includes(s) && nc(get(s))>0);
  const groups = f.groups.map(g=>{
    const n = g.slots.reduce((a,[s])=>a+nc(get(s)),0);
    let txt = "", over = false;
    if(g.max){ over = g.kind==="max" && n>g.max; txt = `${n.toLocaleString()}자 / ${kindTxt(g)}${over?` (${(n-g.max).toLocaleString()}자 초과)`:""}`; }
    else txt = `${n.toLocaleString()}자`;
    if(g.books){ const b = bookCounts(get(g.slots[0][0])); if(b.length) txt += " · 책별 " + b.map((x,i)=>`${i+1}권 ${x}자${x>300?"(초과)":""}`).join(", "); if(b.some(x=>x>300)) over = true; }
    return { txt, over, multi: g.slots.length>1 };
  });
  const main = f.groups.filter(g=>!g.separate).flatMap(g=>g.slots.map(s=>s[0])).concat(extra);
  const sum = main.reduce((a,s)=>a+nc(get(s)),0);
  const sep = f.groups.filter(g=>g.separate);
  let total = f.total ? `본문 합계 ${sum.toLocaleString()}자 / ${f.total.toLocaleString()}자 이내 (공백 제외)` : `본문 합계 ${sum.toLocaleString()}자 (공백 제외)`;
  const totalOver = f.total && sum>f.total;
  if(totalOver) total += ` · ${(sum-f.total).toLocaleString()}자 초과`;
  sep.forEach(g=>{ const n=g.slots.reduce((a,[s])=>a+nc(get(s)),0); total += ` · 독서 ${n.toLocaleString()}자 / ${g.max}자 이내`; });
  return { groups, total, totalOver, extra };
}

/* ================= Apps Script 업로드 ================= */
async function gsPost(body){
  const r = await fetch(CONFIG.APPS_SCRIPT_URL, { method:"POST", body: JSON.stringify(body) });
  const j = await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}
const blobB64 = blob => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=no; r.readAsDataURL(blob); });
const sleep = ms => new Promise(r=>setTimeout(r,ms));
/* 이어올리기 키(같은 파일을 다시 고르면 끊긴 지점부터) — GitHub Pages라 localStorage 사용 가능 */
const upKey = (kind, name, f) => `up_${kind}_${name}_${f.name}_${f.size}_${f.lastModified}`;
const upLoad = k => { try{ const v = JSON.parse(localStorage.getItem(k)||"null"); return (v && Date.now()-v.ts < 6*3600*1000) ? v : null; }catch(e){ return null; } };
const upSave = (k, v) => { try{ localStorage.setItem(k, JSON.stringify({...v, ts:Date.now()})); }catch(e){} };
const upDrop = k => { try{ localStorage.removeItem(k); }catch(e){} };
const isSessionGone = m => /만료|세션|not found|404|410/i.test(String(m||""));
const isBusy = m => /too many|동시|429|503|rate|잠시/i.test(String(m||""));

/* 서버에 "지금까지 몇 바이트 받았나" 물어봄 → {received} 또는 {done,fileId,link} */
async function upStatus(uploadId, total){
  try{ return await gsPost({ action:"status", uploadId, total }); }
  catch(e){ if(/알 수 없는 action/.test(e.message)) return null; throw e; } // 구버전 서버 → 이어올리기 없이 진행
}

/* 업로드 중 화면 꺼짐/절전으로 끊기는 것 방지 */
let _wakeLock = null;
async function keepAwake(){
  try{ if(navigator.wakeLock && !_wakeLock){ _wakeLock = await navigator.wakeLock.request("screen"); _wakeLock.addEventListener("release", ()=>{ _wakeLock = null; }); } }catch(e){}
}
function letSleep(){ try{ _wakeLock && _wakeLock.release(); }catch(e){} _wakeLock = null; }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible" && window._uploading) keepAwake(); });

/* 드라이브로 직접 PUT — XHR을 쓰는 이유: 조각 안에서도 진행률이 보이고 Range 헤더를 읽을 수 있음 */
function drivePut(uri, blob, range, onBytes){
  return new Promise((ok, no)=>{
    const x = new XMLHttpRequest();
    x.open("PUT", uri, true);
    x.setRequestHeader("Content-Range", range);
    if(onBytes && x.upload) x.upload.onprogress = e => onBytes(e.loaded);
    x.onload  = () => ok({ status:x.status, range:x.getResponseHeader("Range"), text:x.responseText||"" });
    x.onerror = () => no(new Error("네트워크 오류"));
    x.onabort = () => no(new Error("업로드가 중단됐어요"));
    x.send(blob);
  });
}
const driveDone = t => { const f = JSON.parse(t||"{}"); return { done:true, fileId:f.id, link:f.webViewLink || ("https://drive.google.com/file/d/"+f.id+"/view") }; };
/* 이어올리기 오프셋을 드라이브에 직접 조회 */
async function driveOffset(uri, total){
  const r = await drivePut(uri, new Blob([]), "bytes */" + total);
  if(r.status === 308){ const m = /(\d+)-(\d+)/.exec(r.range||""); return { received: m ? Number(m[2]) + 1 : 0 }; }
  if(r.status === 200 || r.status === 201) return driveDone(r.text);
  throw new Error("상태 조회 실패 (HTTP " + r.status + ")");
}

/* 업로드 본체
 * 기본 경로: 브라우저 → 구글 드라이브 직접 전송(32MB 조각). 서버를 거치지 않아 빠르고 용량 제약이 사실상 없음.
 * 폴백 경로: 직접 전송이 막힌 환경이면 예전처럼 Apps Script 경유(8MB base64 조각)로 자동 전환. */
async function driveUpload(file, kind, studentName, onProgress, onStatus){
  if(!CONFIG.APPS_SCRIPT_URL) throw new Error("업로드 서버가 아직 연결되지 않았어요. 선생님께 알려주세요.");
  if(!file.size) throw new Error("빈 파일이에요.");
  const key = upKey(kind, studentName, file);
  const say  = m => { if(onStatus) onStatus(m); };
  const tick = n => { if(onProgress) onProgress(Math.min(100, Math.round(n/file.size*100))); };
  let uploadId = null, uri = null, off = 0, res = null;

  window._uploading = true;
  keepAwake();
  try{
    // ① 이어올리기: 이전에 중단된 같은 파일이면 서버 오프셋부터
    const prev = upLoad(key);
    if(prev && prev.uploadId){
      try{
        let st = prev.uri ? await driveOffset(prev.uri, file.size).catch(()=>null) : null;
        if(!st) st = await upStatus(prev.uploadId, file.size);
        if(st && st.done){ upDrop(key); return st; }
        if(st && typeof st.received === "number" && st.received > 0 && st.received < file.size){
          uploadId = prev.uploadId; uri = prev.uri || null; off = st.received;
          say(`이전 업로드를 ${Math.round(off/file.size*100)}%부터 이어서 올려요`);
        }
      }catch(e){ /* 상태 조회 실패 → 새로 시작 */ }
    }
    if(!uploadId){
      const init = await gsPost({ action:"init", kind, student:studentName, filename:file.name,
                                  mimeType:file.type||"application/octet-stream", size:file.size, origin: location.origin });
      uploadId = init.uploadId; uri = init.uri || null; off = 0;
      upSave(key, { uploadId, uri });
    }

    // ② 조각 전송 — 실패하면 자동 재시도(2·5·10·20·30초), 직접 전송이 계속 막히면 서버 경유로 전환
    const WAITS = [2000, 5000, 10000, 20000, 30000];
    let direct = !!uri, directOk = false, directFails = 0, fails = 0;
    tick(off);

    while(off < file.size){
      const step  = direct ? CONFIG.DIRECT_CHUNK : CONFIG.CHUNK;
      const slice = file.slice(off, Math.min(off + step, file.size));
      try{
        if(direct){
          const r = await drivePut(uri, slice, "bytes " + off + "-" + (off + slice.size - 1) + "/" + file.size,
                                   loaded => tick(off + loaded));
          if(r.status === 308){
            const m = /(\d+)-(\d+)/.exec(r.range||"");
            off = m ? Number(m[2]) + 1 : off + slice.size;
          }else if(r.status === 200 || r.status === 201){
            res = driveDone(r.text); off = file.size;
            gsPost({ action:"finish", uploadId, fileId:res.fileId }).catch(()=>{});   // 뒷정리(실패해도 무방)
          }else if(r.status === 404 || r.status === 410){
            throw new Error("업로드 세션이 만료됐어요 (HTTP " + r.status + ")");
          }else{
            throw new Error("업로드 실패 (HTTP " + r.status + ")");
          }
          directOk = true; directFails = 0;
        }else{
          const b64 = await blobB64(slice);
          res = await gsPost({ action:"chunk", uploadId, offset:off, total:file.size, dataB64:b64 });
          off += slice.size;
        }
        fails = 0; say("");
      }catch(e){
        if(isSessionGone(e.message)){ upDrop(key); throw new Error("업로드 세션이 만료됐어요. '업로드 시작'을 다시 눌러 처음부터 올려주세요."); }
        // 직접 전송이 한 번도 성공하지 못한 채 두 번 실패 → 막힌 환경으로 보고 서버 경유로 전환
        if(direct && !directOk && ++directFails >= 2){ direct = false; say("연결 방식을 바꿔서 다시 시도해요"); }
        else if(fails >= WAITS.length){
          throw new Error("연결이 계속 끊겨요. 잠시 후 같은 파일을 다시 선택하고 '업로드 시작'을 누르면 끊긴 지점부터 이어서 올라가요. (" + (e.message||e) + ")");
        }else{
          const w = WAITS[fails] * (isBusy(e.message) ? 2 : 1);
          fails++;
          say(`네트워크 오류 — ${Math.round(w/1000)}초 후 재시도 (${fails}/${WAITS.length})`);
          await sleep(w);
        }
        // 서버가 이미 받은 조각일 수 있으니 오프셋 재확인 후 계속
        try{
          let st = uri ? await driveOffset(uri, file.size).catch(()=>null) : null;
          if(!st) st = await upStatus(uploadId, file.size);
          if(st && st.done){ res = st; off = file.size; }
          else if(st && typeof st.received === "number") off = st.received;
        }catch(e2){}
      }
      tick(off);
    }
    if(!res || !res.done){
      let st = uri ? await driveOffset(uri, file.size).catch(()=>null) : null;
      if(!st) st = await upStatus(uploadId, file.size).catch(()=>null);
      if(st && st.done) res = st;
    }
    if(!res || !res.done) throw new Error("업로드가 완료되지 않았어요. 같은 파일을 다시 선택하면 이어서 올라가요.");
    upDrop(key);
    return res; // {fileId, link}
  }finally{
    window._uploading = false;
    letSleep();
  }
}

/* ③ 아주 큰 파일만 사전 안내(4GB 초과) — 직접 전송이라 대략 분당 150~300MB */
function bigFileOk(f){
  const GB = f.size/1024/1024/1024;
  if(GB < 4) return true;
  const min = Math.round(f.size/1024/1024/200);
  return confirm(`파일이 ${GB.toFixed(1)}GB예요. 업로드에 약 ${min}분 이상 걸릴 수 있어요.\n\n· 와이파이에서 올려주세요\n· 중간에 끊겨도 같은 파일을 다시 선택하면 이어서 올라가요\n\n지금 계속 올릴까요?`);
}

/* ---------- 자소서 임시보관: 저장 버튼을 누르기 전의 글을 이 기기(localStorage)에 자동 보관 ---------- */
const DRAFT_SLOTS = ["essayText","essayText2","essayText3","backupText"];
const draftKey = (id, sfx) => `ihDraft:${ME?ME.id:""}:${id}${sfx||""}`;   // sfx ":prev" = 다른 곳에서 저장된 뒤라 자동으로 불러오지 않고 보류한 글
const draftRead = (id, sfx) => { try{ return JSON.parse(localStorage.getItem(draftKey(id, sfx))||"null"); }catch(e){ return null; } };
const draftDrop = (id, sfx) => { try{ localStorage.removeItem(draftKey(id, sfx)); }catch(e){} };
const draftOverride = d => ({ content: d.v.essayText||"", content2: d.v.essayText2||"", content3: d.v.essayText3||"", backup_content: d.v.backupText||"" });
/* 서버 글이 textarea에 들어갔을 때의 값(줄바꿈 정규화 포함) */
const taVal = t => { const d = document.createElement("div"); d.innerHTML = `<textarea>${esc(t||"")}</textarea>`; return d.firstChild.value; };
let ESSAY_EDIT = null;   // { id, baseAt, base:{칸id:서버 글}, timer }
const essayVals = () => Object.fromEntries(DRAFT_SLOTS.map(k=>[k, (document.getElementById(k)||{value:""}).value]));
const essayOpen = () => !!(ESSAY_EDIT && document.getElementById("essayText") && document.getElementById("draftState"));
const essayDirty = () => { if(!essayOpen()) return false; const v = essayVals(); return DRAFT_SLOTS.some(k=>v[k]!==ESSAY_EDIT.base[k]); };
window.draftFlush = function(){
  if(!essayOpen()) return;
  clearTimeout(ESSAY_EDIT.timer);
  const st = document.getElementById("draftState");
  if(!essayDirty()){ draftDrop(ESSAY_EDIT.id); st.innerHTML = ""; return; }
  let ok = true;
  try{ localStorage.setItem(draftKey(ESSAY_EDIT.id), JSON.stringify({ ts: Date.now(), baseAt: ESSAY_EDIT.baseAt, v: essayVals() })); }catch(e){ ok = false; }
  st.innerHTML = ok
    ? `✏️ 아직 저장 전이에요. 쓴 글은 이 기기에 임시보관됐어요 (${fmtDT(Date.now()).slice(11)}). <b>저장</b>을 눌러야 선생님께 보여요.`
    : `⚠ 아직 저장 전이에요. 이 기기에서는 임시보관이 안 되니 <b>저장</b>을 꼭 눌러 주세요.`;
};
const draftTouch = () => { if(!essayOpen()) return; clearTimeout(ESSAY_EDIT.timer); ESSAY_EDIT.timer = setTimeout(draftFlush, 700); };
window.addEventListener("beforeunload", ev=>{ if(essayDirty()){ draftFlush(); ev.preventDefault(); ev.returnValue = ""; } });
window.addEventListener("pagehide", ()=>draftFlush());
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") draftFlush(); });

    sb.from("essay_comments").select("*").eq("essay_id", essayId).order("created_at",{ascending:false}),
    sb.from("essay_revisions").select("*",{count:"exact",head:true}).eq("essay_id", essayId)
  ]);
  if(e1) err(e1);
  const srv = { essayText: e0.content||"", essayText2: e0.content2||"", essayText3: e0.content3||"", backupText: e0.backup_content||"" };
  const differs = d => !!(d && d.v) && DRAFT_SLOTS.some(k=>{ const x = String(d.v[k]??""); return x!==taVal(srv[k]) && (nc(x)>0 || nc(srv[k])>0); });
  let draft = override ? null : draftRead(essayId), prev = draftRead(essayId, ":prev");

window.findQuote = function(part, q){
  const id = part==="1"?"essayText":part==="2"?"essayText2":part==="3"?"essayText3":"backupText";
  const ta = document.getElementById(id); if(!ta) return;
  const i = ta.value.indexOf(q); if(i<0) return alert("본문에서 이 문장을 찾을 수 없어요 (수정된 것 같아요)");
  ta.focus(); ta.setSelectionRange(i, i+q.length);
  // 선택 위치로 스크롤
  const before = ta.value.slice(0,i); const lines = before.split("\n").length;
  ta.scrollTop = Math.max(0, (lines-3) * 27);
  ta.scrollIntoView({behavior:"smooth", block:"center"});
};

/* 비밀번호 입력(마스킹) 모달 */
function askPin(label){
  return new Promise(res=>{
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:9999";
    ov.innerHTML = `<div style="background:#fff;border-radius:16px;padding:24px;width:280px;box-shadow:0 10px 40px rgba(0,0,0,.25)">
      <div style="font-weight:800;margin-bottom:10px">${label}</div>
      <input id="_pinAsk" type="password" inputmode="numeric" maxlength="4" autocomplete="off"
        style="width:100%;text-align:center;font-size:1.3rem;letter-spacing:.35em;padding:10px;border:2px solid #cbd5e1;border-radius:10px;box-sizing:border-box">
      <div style="display:flex;gap:8px;margin-top:14px">
        <button id="_pinCancel" style="flex:1;background:#eef1f8;border:none;border-radius:10px;padding:11px;font-size:.95rem;cursor:pointer">취소</button>
        <button id="_pinOk" style="flex:1;background:#4f6ef7;color:#fff;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:.95rem;cursor:pointer">확인</button>
      </div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector("#_pinAsk");
    const done = v => { ov.remove(); res(v); };
    ov.querySelector("#_pinOk").onclick = ()=>done(inp.value.trim());
    ov.querySelector("#_pinCancel").onclick = ()=>done(null);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") done(inp.value.trim()); });
    inp.focus();
  });
}

         ${tCounts.extra.map(s=>`<h3>양식 밖 칸 (${PART_LABEL[s]}) <span class="small">${nc(e[SLOT_COL[s]])}자 · 이 학교 양식에 없는 칸</span></h3><pre class="essay-view selectable" data-part="${s}" style="background:#fff7ed">${esc(e[SLOT_COL[s]])}</pre>`).join("")}

    document.getElementById("cmtProp").checked = !!cd.prop;
    if(cd.quote && cd.quote.text) tSetQuote(cd.quote.part, cd.quote.text);
  }
  cmt.addEventListener("input", ()=>{ cmtCount(); cmtDraftSave(); }); cmtCount();

  document.getElementById("cmtPart").addEventListener("change", ()=>{ cmtDraftSave(); showPart(); });
  if(cd && cd.part) showPart();
  document.getElementById("cmtProp").addEventListener("change", cmtDraftSave);

      // 선택이 이 pre 안에서만 이루어졌는지
      if(!sel.anchorNode || !pre.contains(sel.anchorNode) || !pre.contains(sel.focusNode)) return;
      tSetQuote(pre.dataset.part, txt);

};
/* 쓰다 만 코멘트 임시보관 (이 기기) */
const cmtDraftKey = id => `ihCmtDraft:${id}`;
const cmtDraftRead = id => { try{ return JSON.parse(localStorage.getItem(cmtDraftKey(id))||"null"); }catch(e){ return null; } };
window.cmtDraftSave = function(){
  const ta = document.getElementById("cmt"), id = window._cmtEssay; if(!ta || !id) return;
  try{
    if(!ta.value.trim()) return localStorage.removeItem(cmtDraftKey(id));
    localStorage.setItem(cmtDraftKey(id), JSON.stringify({ text: ta.value, part: (document.getElementById("cmtPart")||{}).value, prop: !!(document.getElementById("cmtProp")||{}).checked, quote: window._quote||null, ts: Date.now() }));
  }catch(e){}
};
/* 학생의 현재 글을 코멘트 칸으로 불러와 그 위에서 고쳐 쓰기 */
window.tLoadForRewrite = function(){
  const part = (document.getElementById("cmtPart")||{}).value, ta = document.getElementById("cmt");
  if(!["1","2","3"].includes(part)) return alert("먼저 위에서 영역(① ② ③ 중 하나)을 고르세요");
  const txt = (window._essayTexts||{})[part]||"";
  if(!txt.trim()) return alert("이 영역은 학생 글이 비어 있어요");
  ta.value = ta.value.trim() ? ta.value.replace(/\s+$/,"") + "\n---\n" + txt : txt;
  document.getElementById("cmtProp").checked = true;
  cmtCount(); cmtDraftSave(); ta.focus();
};
window.tToggleProp = async function(id, essayId){
  const { data: c } = await sb.from("essay_comments").select("*").eq("id", id).single(); if(!c) return;
  const content = isProp(c) ? cmText(c) : PROP_TAG + "\n" + c.content;
  const { error } = await sb.from("essay_comments").update({ content }).eq("id", id);
  if(error) return alert(error.message);
  await tOpenEssay(essayId);
};
/* 코멘트 칸 글자수(공백 제외). 구분선(---) 아래에 고쳐 쓴 글을 붙인 경우 그 부분만 따로 센다 */
window.cmtCount = function(){
  const ta = document.getElementById("cmt"), box = document.getElementById("cmtCnt"); if(!ta || !box) return;
  const v = ta.value, m = v.match(/^[ \t]*[-─—=]{3,}[ \t]*$/m);
  box.textContent = `코멘트 ${nc(v).toLocaleString()}자 (공백 제외)` + (m ? ` · 구분선 아래 ${nc(v.slice(m.index + m[0].length)).toLocaleString()}자` : "");
};
window.tChangeSchool = async function(essayId, school){
  if(!school) return;
  const { error } = await sb.from("essays").update({ school }).eq("id", essayId);
  if(error) return alert(error.message);
  tOpenEssay(essayId);
};
window.tSetQuote = function(part, txt){
  window._quote = { part, text: txt }; cmtDraftSave();
  const sel = document.getElementById("cmtPart"); if(sel) sel.value = part;
  const box = document.getElementById("quoteBox");
  if(box) box.innerHTML = `<div class="quote">인용: “${esc(txt.length>140?txt.slice(0,140)+"…":txt)}” <button class="btn-ghost btn-sm" style="padding:2px 6px" onclick="tClearQuote()">✕ 인용 취소</button></div>`;
  document.getElementById("cmt").focus();
};
window.tClearQuote = function(){
  window._quote = null; cmtDraftSave();
  const box = document.getElementById("quoteBox"); if(box) box.innerHTML = "";
};
/* 피드백 템플릿 */
window.tRenderTemplates = async function(){
  const box = document.getElementById("tplBox"); if(!box) return;
  const { data: tpls } = await sb.from("comment_templates").select("*").order("uses",{ascending:false}).order("created_at");
  window._tpls = tpls||[];
  box.innerHTML = window._tpls.length
    ? `자주 쓰는 문구: ${window._tpls.map(t=>`<button class="btn-ghost btn-sm" style="margin:2px" title="${esc(t.content)}" onclick="tUseTemplate('${t.id}')">${esc(t.label)}</button><button class="btn-ghost btn-sm" style="margin:2px 6px 2px 0; padding:4px 6px" onclick="tDelTemplate('${t.id}')" title="템플릿 삭제">×</button>`).join("")}`
    : `<span class="small">템플릿 없음 — 코멘트를 쓰고 "＋ 이 문구를 템플릿으로"를 누르면 저장됩니다.</span>`;
};
window.tUseTemplate = async function(id){
  const t = (window._tpls||[]).find(x=>x.id===id); if(!t) return;
  const ta = document.getElementById("cmt");
  ta.value = (ta.value ? ta.value.replace(/\s*$/,"") + "\n" : "") + t.content;
  cmtCount(); cmtDraftSave();
  ta.focus();
  sb.from("comment_templates").update({ uses: (t.uses||0)+1 }).eq("id", id).then(()=>{});
};
window.tSaveTemplate = async function(){
  const content = (document.getElementById("cmt").value||"").trim();
  if(!content) return alert("먼저 코멘트 칸에 문구를 쓰세요");
  const label = prompt("템플릿 버튼에 표시할 짧은 이름", content.slice(0,12));
  if(label===null) return;
  const { error } = await sb.from("comment_templates").insert({ label: label.trim()||content.slice(0,12), content });
  if(error) return alert(error.message);
  tRenderTemplates();
};
window.tDelTemplate = async function(id){
  if(!confirm("이 템플릿을 삭제할까요?")) return;
  await sb.from("comment_templates").delete().eq("id", id);
  tRenderTemplates();
};
window.tAddComment = async function(essayId){
  const content = (document.getElementById("cmt").value||"").trim();
  if(!content) return alert("내용을 입력하세요");
  const part = (document.getElementById("cmtPart")||{value:"all"}).value;
  const quote = (window._quote && window._quote.part===part) ? window._quote.text : null;
  const asProp = !!(document.getElementById("cmtProp")||{}).checked;
  if(asProp && !["1","2","3"].includes(part)) return alert("제안본은 영역을 ① ② ③ 중 하나로 골라야 학생이 그 칸에 바로 적용할 수 있어요");
  if(asProp && !propSplit(content).prop) return alert("구분선(---) 아래에 고쳐 쓴 글이 없어요");
  const { error } = await sb.from("essay_comments").insert({ essay_id: essayId, content: asProp ? PROP_TAG + "\n" + content : content, part, quote });
  if(error) return alert(error.message);
  try{ localStorage.removeItem(cmtDraftKey(essayId)); }catch(e){}
  tOpenEssay(essayId);
};
window.tDelComment = async function(id, essayId){
  const { error } = await sb.from("essay_comments").delete().eq("id", id);

  tOpenEssay(essayId);
};

      <div class="item ${m.active?"":"small"}">
        <h4>${m.week?`[${m.week}주차] `:""}${esc(m.title)} ${m.target!=="전체"?`<span class="badge ${m.target==="자사고"?"b-jasa":"b-oego"}">${esc(m.target)}</span>`:""} ${m.active?"":'<span class="badge b-none">숨김</span>'}</h4>
        <div class="small"><a href="${esc(m.url)}" target="_blank">${esc(m.url.slice(0,60))}…</a></div>
        <div class="row"><button class="btn-ghost btn-sm" onclick="tToggleMat('${m.id}', ${!m.active})">${m.active?"숨기기":"복구"}</button></div>
      </div>`).join("") || '<div class="pill">등록된 자료가 없어요.</div>'}`;
}
window.tAddMaterial = async function(){
  const title = (document.getElementById("mTitle").value||"").trim();
  if(!title) return alert("제목을 입력하세요");
  const f = document.getElementById("mFile").files[0];
  let url = (document.getElementById("mUrl").value||"").trim();
  const btn = document.getElementById("mBtn");
  try{
    if(f){
      btn.disabled = true; btn.textContent = "업로드 중...";
      const prog = document.getElementById("mProg");
      prog.innerHTML = `<div class="progress"><div id="mBar" style="width:0%"></div></div><div class="small" id="mPct">0%</div>`;
      const res = await driveUpload(f, "material", null, p=>{
        document.getElementById("mBar").style.width = p+"%";
        document.getElementById("mPct").textContent = p+"% · "+f.name;
      });
      url = res.link;
    }
    if(!url) return alert("파일을 선택하거나 링크를 붙여넣으세요");
    const { error } = await sb.from("materials").insert({
      title,
      description: (document.getElementById("mDesc").value||"").trim() || null,
      url,
      week: parseInt(document.getElementById("mWeek").value) || null,
      target: document.getElementById("mTarget").value
    });
    if(error) throw error;
    tPaneMaterials();
  }catch(e){
    btn.disabled = false; btn.textContent = "＋ 등록";
    alert("실패: " + (e.message||e));
  }
};
window.tToggleMat = async function(id, active){
  const { error } = await sb.from("materials").update({ active }).eq("id", id);
  if(error) return alert(error.message);
  tPaneMaterials();
};
