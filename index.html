<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>씨앤씨 면접반</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#f4f6fb; --card:#fff; --ink:#1c2333; --sub:#68718a; --pri:#4f6ef7; --ok:#16a34a; --no:#dc2626; --line:#e5e9f2; --warn:#b45309; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); padding:16px; max-width:760px; margin:0 auto;}
  .card{background:var(--card); border-radius:16px; padding:22px; box-shadow:0 2px 10px rgba(20,30,60,.06); margin-bottom:14px;}
  h1{font-size:1.5rem; margin-bottom:6px;} h2{font-size:1.2rem; margin-bottom:8px;} h3{font-size:1.02rem; margin:14px 0 6px;}
  .sub{color:var(--sub); font-size:.9rem; margin-bottom:14px;}
  .small{color:var(--sub); font-size:.8rem;}
  .pill{background:#eef2ff; border-radius:10px; padding:12px 14px; font-size:.95rem; margin:10px 0; line-height:1.5;}
  .word{font-size:2rem; font-weight:800; margin:18px 0 8px;}
  input[type=text],input[type=date],input[type=number],input[type=url]{width:100%; font-size:1.05rem; padding:11px 13px; border:2px solid var(--line); border-radius:10px; outline:none; margin:6px 0;}
  input:focus,textarea:focus,select:focus{border-color:var(--pri);}
  textarea{width:100%; min-height:320px; font-size:1rem; line-height:1.7; padding:14px; border:2px solid var(--line); border-radius:12px; outline:none; resize:vertical; font-family:inherit;}
  .btn-primary{background:var(--pri); color:#fff; border:none; border-radius:10px; padding:13px 22px; font-size:1.05rem; font-weight:700; cursor:pointer; width:100%;}
  .btn-ghost{background:#eef1f8; color:var(--ink); border:none; border-radius:10px; padding:10px 16px; font-size:.95rem; cursor:pointer;}
  .btn-danger{background:#fee2e2; color:#b91c1c; border:none; border-radius:10px; padding:10px 16px; font-size:.95rem; cursor:pointer;}
  .btn-sm{padding:6px 10px; font-size:.82rem; border-radius:8px;}
  .row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .row .btn-primary{flex:1; width:auto;}
  .student-btn{display:inline-block; background:#eef2ff; border:2px solid transparent; border-radius:12px; padding:14px 18px; margin:5px 4px; font-size:1.05rem; font-weight:700; cursor:pointer;}
  .student-btn:active{border-color:var(--pri);}
  .progress{height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin:8px 0 4px;}
  .progress div{height:100%; background:var(--pri); transition:width .2s;}
  table{width:100%; border-collapse:collapse; font-size:.9rem; margin-top:10px;}
  th,td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
  th{color:var(--sub); font-weight:600; font-size:.8rem;}
  .badge{font-size:.68rem; font-weight:700; border-radius:6px; padding:2px 7px; vertical-align:middle; margin-left:6px; white-space:nowrap;}
  .b-oego{background:#dbeafe; color:#1d4ed8;} .b-jasa{background:#fef3c7; color:#b45309;}
  .b-eng{background:#dcfce7; color:#166534;} .b-both{background:#e9d5ff; color:#7e22ce;} .b-none{background:#e5e9f2; color:#475569;}
  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .tab{flex:1; min-width:90px; text-align:center; padding:10px; border-radius:10px; background:#eef1f8; font-weight:700; font-size:.9rem; cursor:pointer;}
  .tab.on{background:var(--pri); color:#fff;}
  select{font-size:1rem; padding:10px; border:2px solid var(--line); border-radius:10px; background:#fff; margin:6px 0;}
  .flag{background:#f0fdf4; color:#166534; font-size:.85rem; border-radius:8px; padding:9px 11px; margin:8px 0; line-height:1.5;}
  .flag.amber{background:#fffbeb; color:#92400e;}
  .flag.red{background:#fef2f2; color:#991b1b;}
  .item{border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0;}
  .item:active{border-color:var(--pri);}
  .item h4{font-size:1rem; margin-bottom:4px;}
  .clickable{cursor:pointer;}
  .comment{background:#fffbeb; border-radius:10px; padding:10px 12px; margin:8px 0; font-size:.92rem; line-height:1.6; white-space:pre-wrap; word-break:break-word;}
  .comment .small{margin-top:4px; display:block;}
  .cnt{font-size:.82rem; color:var(--sub); text-align:right; margin-top:4px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;}
  pre.essay-view{white-space:pre-wrap; font-family:inherit; font-size:.98rem; line-height:1.8; background:#f8fafc; border-radius:12px; padding:16px;}
  body.wide{max-width:1200px;}
  .split{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;}
  .split .main{flex:2; min-width:320px;}
  .split .side{flex:1; min-width:260px;}
  .quote{background:#fef3c7; border-left:3px solid #d97706; padding:6px 10px; margin:6px 0; font-size:.88rem; line-height:1.55; white-space:pre-wrap; border-radius:6px;}
  .quote.gone{background:#f1f5f9; border-left-color:#94a3b8; color:#64748b;}
  mark.hl{background:#fde68a; border-radius:3px; padding:0 2px;}
  pre.essay-view.selectable{cursor:text; user-select:text;}
  pre.essay-view.selectable::selection, pre.essay-view.selectable *::selection{background:#fde68a;}
</style>
</head>

<script>
/* ================= 설정 ================= */
const CONFIG = {
  SUPABASE_URL: "https://xtxuozcbeqruuigeijsz.supabase.co",
  SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0eHVvemNiZXFydXVpZ2VpanN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNjI4MzMsImV4cCI6MjA5ODczODgzM30.kuHunWODG6_lv3JajIMmr6Xw7yEORy-Dixs-EB4sYaM",
  // ▼ Apps Script 웹 앱 URL (면접반 업로드 백엔드)
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxZoPEmc_hVabGyF9O0oOQAmb3WYr0XGrEIPkX8xDiHzfx7Mkv5Gam_mPnvi5ooP8Fihg/exec",
  CHUNK: 8 * 1024 * 1024   // 8MB (256KB의 배수 — 변경 금지)

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const app = document.getElementById("app");

/* ================= 상태 ================= */
let ME = null;          // 로그인한 학생 {id,name,track,interview_class,...}
let TPIN = null;        // 선생님 PIN(검증 후 보관)
let PINLIST = null;     // 선생님용 학생·PIN 목록

/* ================= 유틸 ================= */
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nc = t => String(t||"").replace(/\s/g,"").length; // 글자수 = 공백 제외
const err = e => { app.innerHTML = `<div class="card"><h2>오류</h2><div class="flag red">${esc(e.message||e)}</div><div class="row"><button class="btn-ghost" onclick="home()">← 처음으로</button></div></div>`; throw e; };
const fmtDT = t => { const d=new Date(t); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const fmtD = t => t ? String(t).slice(0,10).replace(/-/g,".") : "";
const trackBadge = s => s.track==="interview" ? '<span class="badge b-oego">면접</span>'
  : s.track==="both" ? '<span class="badge b-both">면접+영어</span>' : '<span class="badge b-eng">영어</span>';
const classBadge = s => s.interview_class==="외고국제고" ? '<span class="badge b-oego">외고·국제고</span>'
  : s.interview_class==="자사고" ? '<span class="badge b-jasa">자사고</span>' : "";
const mb = b => b ? (b/1024/1024).toFixed(1)+"MB" : "-";
const isInterview = s => s.track==="interview" || s.track==="both";
/* 대상 필터: 분반 미지정 학생에게는 전부 보여줌 */
const forMe = (row, st) => row.target==="전체" || !st.interview_class || row.target===st.interview_class;
/* 코멘트 파트 라벨 */
const PART_LABEL = { "1":"① 자기주도학습", "2":"② 지원동기·진로", "3":"③ 인성", "backup":"📦 백업", "all":"전체" };
const partBadge = p => `<span class="badge ${p==="all"?"b-none":"b-oego"}">${PART_LABEL[p]||"전체"}</span>`;
/* 학생 화면 코멘트 카드 (확인/반영 버튼 포함) */
const quoteBox = (c, editable) => {
  if(!c.quote) return "";
  const src = editable ? (partText(c.part)||"") : (window._essayTexts||{})[c.part]||"";
  const found = src.indexOf(c.quote) >= 0;
  return `<div class="quote ${found?"":"gone"}">${found?"":"<b>원문이 수정됨 · </b>"}“${esc(c.quote)}”${found&&editable?` <button class="btn-ghost btn-sm" style="padding:2px 6px" onclick="findQuote('${c.part}', ${JSON.stringify(c.quote).replace(/"/g,"&quot;")})">본문에서 찾기</button>`:""}</div>`;
};
const partText = p => { const el = document.getElementById(p==="1"?"essayText":p==="2"?"essayText2":p==="3"?"essayText3":p==="backup"?"backupText":""); return el ? el.value : ""; };
const stuComment = c => `<div class="comment" id="cm-${c.id}">${partBadge(c.part||"all")}${quoteBox(c, true)}<div style="margin-top:6px">${esc(c.content)}</div>
  <span class="small">${fmtDT(c.created_at)}
    ${c.student_status==="applied"?'<b style="color:#166534">✅ 반영했어요</b>':c.student_status==="seen"?'<b style="color:#1d4ed8">👀 확인했어요</b> <button class="btn-ghost btn-sm" onclick="markComment(\''+c.id+'\',\'applied\')">반영했어요</button>':'<button class="btn-ghost btn-sm" onclick="markComment(\''+c.id+'\',\'seen\')">확인했어요</button> <button class="btn-ghost btn-sm" onclick="markComment(\''+c.id+'\',\'applied\')">반영했어요</button>'}
  </span></div>`;
const commentsFor = (list, part) => (list||[]).filter(c=>(c.part||"all")===part).map(stuComment).join("");

/* ================= Apps Script 업로드 ================= */
async function gsPost(body){
  const r = await fetch(CONFIG.APPS_SCRIPT_URL, { method:"POST", body: JSON.stringify(body) });
  const j = await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}
const blobB64 = blob => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=no; r.readAsDataURL(blob); });
async function driveUpload(file, kind, studentName, onProgress){
  if(!CONFIG.APPS_SCRIPT_URL) throw new Error("업로드 서버가 아직 연결되지 않았어요. 선생님께 알려주세요.");
  if(!file.size) throw new Error("빈 파일이에요.");
  const init = await gsPost({ action:"init", kind, student:studentName, filename:file.name, mimeType:file.type||"application/octet-stream", size:file.size });
  let off = 0, res = null;
  while(off < file.size){
    const slice = file.slice(off, Math.min(off+CONFIG.CHUNK, file.size));
    const b64 = await blobB64(slice);
    res = await gsPost({ action:"chunk", uploadId:init.uploadId, offset:off, total:file.size, dataB64:b64 });
    off += slice.size;
    if(onProgress) onProgress(Math.min(100, Math.round(off/file.size*100)));
  }
  if(!res || !res.done) throw new Error("업로드가 완료되지 않았어요. 다시 시도하세요.");
  return res; // {fileId, link}
}

/* ================= 로그인 화면 ================= */
async function home(){
  ME = null; sessionStorage.removeItem("ihub_me");
  document.body.classList.remove("wide");
  app.innerHTML = `<div class="card"><h1>씨앤씨 면접반 🎤</h1><div class="sub">불러오는 중...</div></div>`;

  if(error) err(error);

  const btn = s => `<button class="student-btn" onclick='pickStudent(${JSON.stringify(s)})'>${esc(s.name)}</button>`;
  app.innerHTML = `
   <div class="card">
     <h1>씨앤씨 면접반 🎤</h1>
     <div class="sub">이름을 선택하고 개인 비밀번호로 들어오세요</div>
     ${students.map(btn).join("") || '<div class="pill">등록된 학생이 없어요.</div>'}
     <div class="row"><button class="btn-ghost btn-sm" onclick="teacherLogin()">🔑 선생님</button></div>
   </div>`;
}

window.pickStudent = function(student){
  app.innerHTML = `
   <div class="card">
     <h2>본인 확인</h2>
     <div class="word" style="font-size:2.2rem; text-align:center">${esc(student.name)}</div>
     <div class="pill">'<b>${esc(student.name)}</b>' 학생 본인이 맞나요? 개인 비밀번호 4자리를 입력하세요.<br><span class="small">비밀번호는 다른 사람에게 알려주지 마세요.</span></div>
     <div class="row" style="justify-content:center">
       <input type="password" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"
         placeholder="비밀번호 4자리" style="text-align:center; font-size:1.3rem; letter-spacing:.35em; width:190px; padding:10px; border:2px solid #cbd5e1; border-radius:10px">
     </div>
     <div class="row"><button class="btn-primary" onclick='pinGo(${JSON.stringify(student)})'>네, ${esc(student.name)} 입니다 →</button></div>
     <div class="row"><button class="btn-ghost btn-sm" onclick="home()">← 아니에요, 이름 다시 선택</button></div>
   </div>`;
  const inp = document.getElementById("pinInput");
  inp.focus();
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") pinGo(student); });
};

window.pinGo = async function(student){
  const inp = document.getElementById("pinInput");
  const pin = (inp && inp.value || "").trim();
  if(!/^\d{4}$/.test(pin)){ alert("비밀번호 4자리(숫자)를 입력하세요"); if(inp) inp.focus(); return; }
  document.querySelectorAll("button").forEach(b=>b.disabled=true);
  const { data: ok, error } = await sb.rpc("student_pin_verify", { p_student_id: student.id, p_pin: pin });
  if(error){ document.querySelectorAll("button").forEach(b=>b.disabled=false); return alert("오류: "+error.message); }
  if(!ok){
    document.querySelectorAll("button").forEach(b=>b.disabled=false);
    if(inp){ inp.value=""; inp.focus(); }
    return alert("비밀번호가 달라요. 다시 확인하세요.");
  }
  ME = student;
  sessionStorage.setItem("ihub_me", JSON.stringify(student));
  studentHome("essay");
};

/* ================= 학생 홈 ================= */
window.studentHome = function(tab){

  document.body.classList.remove("wide");
  app.innerHTML = `

   </div>`;

/* ---------- 자소서 ---------- */
async function paneEssays(){
  const pane = document.getElementById("pane");
  const { data: essays, error } = await sb.from("essays").select("*").eq("student_id", ME.id).is("deleted_at", null).order("updated_at",{ascending:false});
  if(error) err(error);
  pane.innerHTML = `
    <div class="sub">지원 학교별로 자소서를 만들고, 고칠 때마다 저장하세요. 이전 버전은 자동 보관됩니다.</div>
    ${essays.map(e=>`
      <div class="item clickable" onclick="openEssay('${e.id}')">
        <h4>${esc(e.school)} — ${esc(e.title)}</h4>
        <div class="small">글자수 ${nc(e.content)+nc(e.content2)+nc(e.content3)}자(공백 제외) · 마지막 저장 ${fmtDT(e.updated_at)}</div>
      </div>`).join("") || '<div class="pill">아직 자소서가 없어요. 아래에서 새로 만들어 보세요.</div>'}
    <h3>새 자소서 만들기</h3>
    <input type="text" id="newSchool" placeholder="지원 학교 (예: 이화외고, 하나고, 공통)">
    <input type="text" id="newTitle" placeholder="제목 (예: 자기주도학습 영역)">
    <div class="row"><button class="btn-primary" onclick="createEssay()">＋ 만들기</button></div>`;
}

window.createEssay = async function(){
  const school = (document.getElementById("newSchool").value||"").trim() || "공통";
  const title  = (document.getElementById("newTitle").value||"").trim() || "자기소개서";
  const { data, error } = await sb.from("essays").insert({ student_id: ME.id, school, title }).select().single();
  if(error) err(error);
  openEssay(data.id);
};

window.openEssay = async function(essayId){
  const [{ data: e, error: e1 }, { data: comments }, { count: revCount }] = await Promise.all([
    sb.from("essays").select("*").eq("id", essayId).single(),
    sb.from("essay_comments").select("*").eq("essay_id", essayId).order("created_at",{ascending:false}),
    sb.from("essay_revisions").select("*",{count:"exact",head:true}).eq("essay_id", essayId)
  ]);
  if(e1) err(e1);
  document.body.classList.add("wide");
  app.innerHTML = `
   <div class="card">
     <div class="topbar">
       <h2>${esc(e.school)} — ${esc(e.title)}</h2>
       <button class="btn-ghost btn-sm" onclick="studentHome('essay')">← 목록</button>
     </div>
     <div class="small">마지막 저장 ${fmtDT(e.updated_at)} · 보관된 버전 ${revCount||0}개</div>
     <div class="split">
       <div class="main">
         <h3 style="margin-top:8px">① 자기주도학습 <span class="small">(공식 글자수 포함)</span></h3>
         <textarea id="essayText" style="min-height:180px">${esc(e.content)}</textarea>
         <div class="cnt" id="cnt"></div>
         ${commentsFor(comments,"1")}
         <h3>② 지원동기·진로 <span class="small">(공식 글자수 포함)</span></h3>
         <textarea id="essayText2" style="min-height:180px">${esc(e.content2||"")}</textarea>
         <div class="cnt" id="cnt2"></div>
         ${commentsFor(comments,"2")}
         <h3>③ 인성 <span class="small">(공식 글자수 포함)</span></h3>
         <textarea id="essayText3" style="min-height:180px">${esc(e.content3||"")}</textarea>
         <div class="cnt" id="cnt3"></div>
         ${commentsFor(comments,"3")}
         <div class="cnt" id="cntTotal" style="font-weight:700"></div>
         <div class="row">
           <button class="btn-primary" onclick="saveEssay('${e.id}')">💾 저장</button>
           <button class="btn-ghost" onclick="essayHistory('${e.id}')">🕘 이전 버전</button>
           <button class="btn-danger btn-sm" onclick="deleteEssay('${e.id}')">삭제</button>
         </div>
       </div>
       <div class="side">
         <h3 style="margin-top:8px">📦 백업 섹션 <span class="small">(글자수 미포함)</span></h3>
         <div class="small" style="margin-bottom:4px">본문에서 뺀 문장·에피소드·부가정보를 버리지 말고 여기에 보관하세요. 선생님도 함께 봅니다.</div>
         <textarea id="backupText" style="min-height:220px">${esc(e.backup_content||"")}</textarea>
         <div class="cnt" id="bcnt"></div>
         ${commentsFor(comments,"backup")}
         ${commentsFor(comments,"all")?`<h3>👨‍🏫 선생님 코멘트 (전체)</h3>${commentsFor(comments,"all")}`:""}

  ta.focus(); ta.setSelectionRange(i, i+q.length);

/* 비밀번호 입력(마스킹) 모달 */
function askPin(label){
  return new Promise(res=>{
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:9999";
    ov.innerHTML = `<div style="background:#fff;border-radius:16px;padding:24px;width:280px;box-shadow:0 10px 40px rgba(0,0,0,.25)">
      <div style="font-weight:800;margin-bottom:10px">${label}</div>
      <input id="_pinAsk" type="password" inputmode="numeric" maxlength="4" autocomplete="off"
        style="width:100%;text-align:center;font-size:1.3rem;letter-spacing:.35em;padding:10px;border:2px solid #cbd5e1;border-radius:10px;box-sizing:border-box">
      <div style="display:flex;gap:8px;margin-top:14px">
        <button id="_pinCancel" style="flex:1;background:#eef1f8;border:none;border-radius:10px;padding:11px;font-size:.95rem;cursor:pointer">취소</button>
        <button id="_pinOk" style="flex:1;background:#4f6ef7;color:#fff;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:.95rem;cursor:pointer">확인</button>
      </div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector("#_pinAsk");
    const done = v => { ov.remove(); res(v); };
    ov.querySelector("#_pinOk").onclick = ()=>done(inp.value.trim());
    ov.querySelector("#_pinCancel").onclick = ()=>done(null);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") done(inp.value.trim()); });
    inp.focus();
  });
}

    materials: await grab("materials")
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `면접반_백업_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
};

window.tOpenEssay = async function(essayId){
  const [{ data: e, error: e1 }, { data: comments }, { data: revs }] = await Promise.all([
    sb.from("essays").select("*, students(name)").eq("id", essayId).single(),
    sb.from("essay_comments").select("*").eq("essay_id", essayId).order("created_at",{ascending:false}),
    sb.from("essay_revisions").select("id, saved_at").eq("essay_id", essayId).order("saved_at",{ascending:false})
  ]);
  if(e1) err(e1);
  document.body.classList.add("wide");
  app.innerHTML = `
   <div class="card">
     <div class="topbar"><h2>${esc(e.students?.name)} — ${esc(e.school)} · ${esc(e.title)}</h2>
       <button class="btn-ghost btn-sm" onclick="teacherHome('essays')">← 목록</button></div>
     <div class="small">본문 합계 ${nc(e.content)+nc(e.content2)+nc(e.content3)}자 (① ${nc(e.content)} · ② ${nc(e.content2)} · ③ ${nc(e.content3)} · 공백 제외) · 백업 ${nc(e.backup_content)}자 · 저장 ${revs?.length||0}회 · 마지막 ${fmtDT(e.updated_at)}</div>
     <div class="split">
       <div class="main">
         <div class="small" style="margin-bottom:4px">💡 본문에서 문장을 <b>드래그</b>하면 그 부분이 코멘트에 인용됩니다.</div>
         <h3 style="margin-top:8px">① 자기주도학습</h3>
         <pre class="essay-view selectable" data-part="1">${esc(e.content)||"(비어 있음)"}</pre>
         <h3>② 지원동기·진로</h3>
         <pre class="essay-view selectable" data-part="2">${esc(e.content2||"")||"(비어 있음)"}</pre>
         <h3>③ 인성</h3>
         <pre class="essay-view selectable" data-part="3">${esc(e.content3||"")||"(비어 있음)"}</pre>
         ${e.backup_content?`<h3>📦 백업 섹션 <span class="small">(글자수 미포함)</span></h3><pre class="essay-view selectable" data-part="backup" style="background:#fffbeb">${esc(e.backup_content)}</pre>`:""}
       </div>
       <div class="side">
         <h3 style="margin-top:8px">코멘트 남기기</h3>
         <select id="cmtPart" style="width:100%">
           <option value="1">① 자기주도학습</option>
           <option value="2">② 지원동기·진로</option>
           <option value="3">③ 인성</option>
           <option value="backup">📦 백업 섹션</option>
           <option value="all">전체 (자소서 전반)</option>
         </select>
         <div id="quoteBox" class="small" style="margin:6px 0"></div>
         <div id="tplBox" class="small" style="margin:6px 0"></div>
         <textarea id="cmt" style="min-height:110px" placeholder="Enter로 등록 · Shift+Enter 줄바꿈"></textarea>
         <div class="row"><button class="btn-primary" onclick="tAddComment('${e.id}')">코멘트 등록</button>
           <button class="btn-ghost btn-sm" onclick="tSaveTemplate()">＋ 이 문구를 템플릿으로</button></div>
         ${(comments&&comments.length)?`<h3>등록된 코멘트</h3>${comments.map(c=>`<div class="comment">${partBadge(c.part||"all")} ${c.student_status==="applied"?'<span class="badge b-eng">반영됨</span>':c.student_status==="seen"?'<span class="badge b-oego">확인함</span>':'<span class="badge b-jasa">미확인</span>'}${quoteBox(c,false)}<div style="margin-top:6px">${esc(c.content)}</div><span class="small">${fmtDT(c.created_at)} <button class="btn-ghost btn-sm" onclick="tDelComment('${c.id}','${e.id}')">삭제</button></span></div>`).join("")}`:""}
       </div>
     </div>
   </div>`;
  window._essayTexts = { "1": e.content||"", "2": e.content2||"", "3": e.content3||"", "backup": e.backup_content||"" };
  window._quote = null;
  const cmt = document.getElementById("cmt");
  cmt.focus();
  cmt.addEventListener("keydown", ev=>{ if(ev.key==="Enter" && !ev.shiftKey){ ev.preventDefault(); tAddComment(e.id); } });
  tRenderTemplates();
  // 드래그 선택 → 인용
  document.querySelectorAll("pre.essay-view.selectable").forEach(pre=>{
    pre.addEventListener("mouseup", ()=>{
      const sel = window.getSelection(); const txt = sel ? sel.toString().trim() : "";
      if(!txt || txt.length < 2) return;
      // 선택이 이 pre 안에서만 이루어졌는지
      if(!sel.anchorNode || !pre.contains(sel.anchorNode) || !pre.contains(sel.focusNode)) return;
      tSetQuote(pre.dataset.part, txt);
    });
  });
};
window.tSetQuote = function(part, txt){
  window._quote = { part, text: txt };
  const sel = document.getElementById("cmtPart"); if(sel) sel.value = part;
  const box = document.getElementById("quoteBox");
  if(box) box.innerHTML = `<div class="quote">인용: “${esc(txt.length>140?txt.slice(0,140)+"…":txt)}” <button class="btn-ghost btn-sm" style="padding:2px 6px" onclick="tClearQuote()">✕ 인용 취소</button></div>`;
  document.getElementById("cmt").focus();
};
window.tClearQuote = function(){
  window._quote = null;
  const box = document.getElementById("quoteBox"); if(box) box.innerHTML = "";
};
/* 피드백 템플릿 */
window.tRenderTemplates = async function(){
  const box = document.getElementById("tplBox"); if(!box) return;
  const { data: tpls } = await sb.from("comment_templates").select("*").order("uses",{ascending:false}).order("created_at");
  window._tpls = tpls||[];
  box.innerHTML = window._tpls.length
    ? `자주 쓰는 문구: ${window._tpls.map(t=>`<button class="btn-ghost btn-sm" style="margin:2px" title="${esc(t.content)}" onclick="tUseTemplate('${t.id}')">${esc(t.label)}</button><button class="btn-ghost btn-sm" style="margin:2px 6px 2px 0; padding:4px 6px" onclick="tDelTemplate('${t.id}')" title="템플릿 삭제">×</button>`).join("")}`
    : `<span class="small">템플릿 없음 — 코멘트를 쓰고 "＋ 이 문구를 템플릿으로"를 누르면 저장됩니다.</span>`;
};
window.tUseTemplate = async function(id){
  const t = (window._tpls||[]).find(x=>x.id===id); if(!t) return;
  const ta = document.getElementById("cmt");
  ta.value = (ta.value ? ta.value.replace(/\s*$/,"") + "\n" : "") + t.content;
  ta.focus();
  sb.from("comment_templates").update({ uses: (t.uses||0)+1 }).eq("id", id).then(()=>{});
};
window.tSaveTemplate = async function(){
  const content = (document.getElementById("cmt").value||"").trim();
  if(!content) return alert("먼저 코멘트 칸에 문구를 쓰세요");
  const label = prompt("템플릿 버튼에 표시할 짧은 이름", content.slice(0,12));
  if(label===null) return;
  const { error } = await sb.from("comment_templates").insert({ label: label.trim()||content.slice(0,12), content });
  if(error) return alert(error.message);
  tRenderTemplates();
};
window.tDelTemplate = async function(id){
  if(!confirm("이 템플릿을 삭제할까요?")) return;
  await sb.from("comment_templates").delete().eq("id", id);
  tRenderTemplates();
};
window.tAddComment = async function(essayId){
  const content = (document.getElementById("cmt").value||"").trim();
  if(!content) return alert("내용을 입력하세요");
  const part = (document.getElementById("cmtPart")||{value:"all"}).value;
  const quote = (window._quote && window._quote.part===part) ? window._quote.text : null;
  const { error } = await sb.from("essay_comments").insert({ essay_id: essayId, content, part, quote });
  if(error) return alert(error.message);
  tOpenEssay(essayId);
};
window.tDelComment = async function(id, essayId){
  const { error } = await sb.from("essay_comments").delete().eq("id", id);
  if(error) return alert(error.message);
  tOpenEssay(essayId);
};

/* ---------- 과제·제출 ---------- */
async function tPaneAssignments(){
  const pane = document.getElementById("pane");
  const [{ data: asgs, error: e1 }, { data: subs, error: e2 }, { data: students }] = await Promise.all([
    sb.from("assignments").select("*").order("created_at",{ascending:false}),
    sb.from("video_submissions").select("*, students(name)").order("created_at",{ascending:false}),
    sb.from("students").select("*").eq("active", true)
  ]);
  if(e1) err(e1); if(e2) err(e2);
  const ivCount = students.filter(isInterview).length;
  pane.innerHTML = `
    <h3>새 과제 등록</h3>
    <input type="text" id="aTitle" placeholder="과제 제목 (예: 1분 자기소개 영상)">
    <input type="text" id="aDesc" placeholder="설명 (선택)">
    <div class="row" style="align-items:center">
      <input type="date" id="aDue" style="flex:1">
      <select id="aTarget"><option value="전체">전체</option><option value="외고국제고">외고·국제고</option><option value="자사고">자사고</option></select>
    </div>
    <div class="row"><button class="btn-primary" onclick="tAddAsg()">＋ 과제 올리기</button></div>
    <h3>과제별 제출 현황</h3>
    ${asgs.map(a=>{
      const s = subs.filter(x=>x.assignment_id===a.id);
      const names = [...new Set(s.map(x=>x.students?.name))];
      return `<div class="item ${a.active?"":"small"}">
        <h4>${esc(a.title)} ${a.target!=="전체"?`<span class="badge ${a.target==="자사고"?"b-jasa":"b-oego"}">${esc(a.target)}</span>`:""} ${a.active?"":'<span class="badge b-none">마감됨</span>'}</h4>
        <div class="small">${a.due_date?`마감 ${fmtD(a.due_date)} · `:""}제출 ${names.length}명 / 면접반 ${ivCount}명</div>
        ${s.map(x=>`<div class="small">· <b>${esc(x.students?.name)}</b> — ${esc(x.filename)} (${mb(x.bytes)}) ${fmtDT(x.created_at)}${x.note?` · "${esc(x.note)}"`:""} ${x.drive_link?`<a href="${esc(x.drive_link)}" target="_blank">▶ 보기</a>`:""}</div>`).join("")}
        <div class="row"><button class="btn-ghost btn-sm" onclick="tToggleAsg('${a.id}', ${!a.active})">${a.active?"마감하기":"다시 열기"}</button>
          <button class="btn-danger btn-sm" onclick="tDelAsg('${a.id}')">삭제</button></div>
      </div>`;
    }).join("") || '<div class="pill">등록된 과제가 없어요.</div>'}
    ${subs.filter(x=>!x.assignment_id).length?`<h3>자유 업로드</h3>${subs.filter(x=>!x.assignment_id).map(x=>`<div class="small">· <b>${esc(x.students?.name)}</b> — ${esc(x.filename)} (${mb(x.bytes)}) ${fmtDT(x.created_at)}${x.note?` · "${esc(x.note)}"`:""} ${x.drive_link?`<a href="${esc(x.drive_link)}" target="_blank">▶ 보기</a>`:""}</div>`).join("")}`:""}`;
}
window.tAddAsg = async function(){
  const title = (document.getElementById("aTitle").value||"").trim();
  if(!title) return alert("제목을 입력하세요");
  const { error } = await sb.from("assignments").insert({
    title,
    description: (document.getElementById("aDesc").value||"").trim() || null,
    due_date: document.getElementById("aDue").value || null,
    target: document.getElementById("aTarget").value
  });
  if(error) return alert(error.message);
  tPaneAssignments();
};
window.tToggleAsg = async function(id, active){
  const { error } = await sb.from("assignments").update({ active }).eq("id", id);
  if(error) return alert(error.message);
  tPaneAssignments();
};
window.tDelAsg = async function(id){
  if(!confirm("이 과제를 삭제할까요?\n이미 제출된 영상 기록은 '자유 업로드' 목록으로 옮겨지고, 드라이브의 영상 파일은 그대로 남습니다.")) return;
  const { error } = await sb.from("assignments").delete().eq("id", id);
  if(error) return alert(error.message);
  tPaneAssignments();
};

  if(error) err(error);
  pane.innerHTML = `
    <h3>자료 올리기</h3>
    <input type="text" id="mTitle" placeholder="자료 제목 (예: 1주차 오리엔테이션 슬라이드)">
    <input type="text" id="mDesc" placeholder="설명 (선택)">
    <div class="row" style="align-items:center">
      <input type="number" id="mWeek" placeholder="주차" style="flex:1">
      <select id="mTarget"><option value="전체">전체</option><option value="외고국제고">외고·국제고</option><option value="자사고">자사고</option></select>
    </div>
    <div class="pill">방법 A — 파일 업로드 (내 드라이브 '면접반 플랫폼/강의자료'에 저장 + 자동 링크 공유)<br>
      <input type="file" id="mFile" style="margin-top:6px"></div>
    <div class="pill">방법 B — 링크 붙여넣기 (이미 드라이브·유튜브 등에 있는 자료)<br>
      <input type="url" id="mUrl" placeholder="https://..." style="margin-top:6px"></div>
    <div id="mProg"></div>
    <div class="row"><button class="btn-primary" id="mBtn" onclick="tAddMaterial()">＋ 등록</button></div>
    <h3>등록된 자료</h3>
    ${mats.map(m=>`
      <div class="item ${m.active?"":"small"}">
        <h4>${m.week?`[${m.week}주차] `:""}${esc(m.title)} ${m.target!=="전체"?`<span class="badge ${m.target==="자사고"?"b-jasa":"b-oego"}">${esc(m.target)}</span>`:""} ${m.active?"":'<span class="badge b-none">숨김</span>'}</h4>
        <div class="small"><a href="${esc(m.url)}" target="_blank">${esc(m.url.slice(0,60))}…</a></div>
        <div class="row"><button class="btn-ghost btn-sm" onclick="tToggleMat('${m.id}', ${!m.active})">${m.active?"숨기기":"복구"}</button></div>
      </div>`).join("") || '<div class="pill">등록된 자료가 없어요.</div>'}`;
}
window.tAddMaterial = async function(){
  const title = (document.getElementById("mTitle").value||"").trim();
  if(!title) return alert("제목을 입력하세요");
  const f = document.getElementById("mFile").files[0];
  let url = (document.getElementById("mUrl").value||"").trim();
  const btn = document.getElementById("mBtn");
  try{
    if(f){
      btn.disabled = true; btn.textContent = "업로드 중...";
      const prog = document.getElementById("mProg");
      prog.innerHTML = `<div class="progress"><div id="mBar" style="width:0%"></div></div><div class="small" id="mPct">0%</div>`;
      const res = await driveUpload(f, "material", null, p=>{
        document.getElementById("mBar").style.width = p+"%";
        document.getElementById("mPct").textContent = p+"% · "+f.name;
      });
      url = res.link;
    }
    if(!url) return alert("파일을 선택하거나 링크를 붙여넣으세요");
    const { error } = await sb.from("materials").insert({
      title,
      description: (document.getElementById("mDesc").value||"").trim() || null,
      url,
      week: parseInt(document.getElementById("mWeek").value) || null,
      target: document.getElementById("mTarget").value
    });
    if(error) throw error;
    tPaneMaterials();
  }catch(e){
    btn.disabled = false; btn.textContent = "＋ 등록";
    alert("실패: " + (e.message||e));
  }
};
window.tToggleMat = async function(id, active){
  const { error } = await sb.from("materials").update({ active }).eq("id", id);
  if(error) return alert(error.message);
  tPaneMaterials();
};
